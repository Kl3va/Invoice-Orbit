name: Keep Render App Awake

on:
  schedule:
    # Runs every 10 minutes (must be under Render's ~15 min sleep window)
    - cron: "*/10 * * * *"
  workflow_dispatch: # lets you trigger it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf https://invoice-orbit.onrender.com/health && echo "Ping succeeded" || echo "Ping failed"
